plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	// Keine zusaetzlichen Repositories noetig: Loom bringt die Maven-Quellen
	// fuer Minecraft und dessen Bibliotheken selbst mit.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"lowendboost" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// Echter Spieltest: startet einen Minecraft-Client (in der CI ohne Bildschirm), betritt eine Welt und
	// prueft die Mod im laufenden Spiel. Aufruf: ./gradlew runClientGameTest
	// Der Test liegt in src/gametest und wird nicht in die Mod-JAR gepackt.
	configureTests {
		createSourceSet = true
		modId = "lowendboost-gametest"
		enableGameTests = false
		enableClientGameTests = true
		// Das Laufverzeichnis bleibt erhalten, damit die CI vorher eine options.txt mit der gewuenschten
		// Grafik-Schnittstelle (OpenGL oder Vulkan) hineinlegen kann.
		clearRunDirectory = false
	}
}

dependencies {
	// Versionen stehen in gradle.properties
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API: wird fuer Tick-Events und Client-Befehle gebraucht.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	// Erzeugt zusaetzlich ein -sources.jar (nicht ins mods-Verzeichnis kopieren!)
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
