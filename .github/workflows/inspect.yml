name: inspect
on:
  push:
    branches: ['inspect-*']
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew compileClientJava --stacktrace
      - name: API dump 2
        run: |
          set +e
          JARS=$(find ~/.gradle/caches -name '*.jar' 2>/dev/null | grep -v -E '/wrapper/|gradle-(api|kotlin)|groovy|kotlin-|loom-|/plugins?/')
          CP=$(echo "$JARS" | tr '\n' ':')
          J() { javap -p -cp "$CP" "$1" 2>&1; }
          F() { local cls="$1" pat="$2" lim="$3"; echo; echo "##### $cls  (Filter: $pat)"; J "$cls" | grep -E "$pat" | head -n "$lim"; }
          F com.mojang.renderpearl.api.device.GpuDevice '\(|class|interface' 80
          F com.mojang.renderpearl.api.device.DeviceInfo '\(|class|interface|record' 30
          F com.mojang.renderpearl.api.device.GpuBackend '\(|class|interface' 30
          F com.mojang.renderpearl.api.device.GpuSurface '\(|class|interface' 40
          F 'com.mojang.renderpearl.api.device.GpuSurface$PresentMode' 'static|enum' 12
          F com.mojang.renderpearl.frontend.FrontendGpuSurface '\(|class' 40
          F com.mojang.renderpearl.frontend.FrontendGpuDevice '\(|class' 60
          F net.minecraft.client.gui.components.debug.DebugEntryGpuUtilization '\(|class|private|public' 25
          F net.minecraft.client.gui.components.debug.DebugEntryFps '\(|class' 12
          F net.minecraft.client.gui.components.debug.DebugEntrySystemSpecs '\(|class' 20
          F net.minecraft.client.gui.components.debug.DebugEntryTps '\(|class' 12
          F net.minecraft.client.Minecraft 'pu|Gpu|GPU|tilization|Query|Timer|timer|Frame|frame' 40
          F com.mojang.blaze3d.systems.RenderSystem 'public static' 90
          F net.minecraft.client.PreferredGraphicsApi 'static|enum|\(' 14
          F 'com.mojang.blaze3d.platform.Window$FramebufferSize' '\(|class|record' 12
          F net.minecraft.client.server.IntegratedServer 'class|\(' 20
